name: Build

on:
  push:
    branches: [main]

# Cancel a superseded release build on the same ref (rapid fixes on main).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release face (ADR-0131): the full three-platform tauri build and bundle
# artifact upload live here, separate from the CI quality gates — the release
# flow picks the artifacts up from these runs. This workflow simply does not
# fire on PRs or develop pushes, keeping those faces free of skipped-job
# noise.
jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let sibling legs finish when one fails — the per-OS report is the
      # whole point of the matrix.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev

      # The mac leg builds universal (ADR-0143), which needs BOTH darwin
      # targets; dtolnay's action installs only the host (aarch64) by default.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # rust-toolchain.toml pins the compiled-with toolchain (host-only std);
      # the targets above land on the action's stable instead. Install the
      # darwin std onto the pinned toolchain the sidecar build resolves.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        if: matrix.os == 'macos-latest'

      # Same cache setup as the CI rust job (keys are per job + OS, so legs warm
      # their own slice) — duckdb "bundled" compiles DuckDB from C++ source
      # (~5-8 min cold per OS).
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Quality gates are NOT repeated here: the CI workflow's frontend/rust
      # jobs own them, and tauri's beforeBuildCommand (tsc --noEmit + vite
      # build) already covers type-check + bundle for the packaged app.
      #
      # macOS builds UNIVERSAL (ADR-0143): the one .app.tar.gz updater
      # artifact serves both darwin manifest keys, so every installed arch
      # stays on the update chain. The universal target relocates the bundle
      # tree to target/universal-apple-darwin/release/bundle.
      # TAURI_SIGNING_PRIVATE_KEY (minisign, passwordless) turns
      # createUpdaterArtifacts into signed updater artifacts + .sig files;
      # without the secret the bundler skips them and the updater-artifact
      # upload below stays empty (warn) — the release workflow's manifest
      # gate fails loudly instead.
      - name: Build (tauri build)
        run: npm run tauri -- build ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # productName is "TOPTOP Duck" (space) for the surfaces users read —
      # shortcut label, uninstall list. Bundle files drop the space so release
      # asset names stay URL-clean: TOPTOP-Duck_<version>_<target>.<ext>.
      # Files only: the macOS .app directory keeps its spaced name on purpose.
      - name: Normalize bundle artifact names
        shell: bash
        run: |
          BUNDLE_ROOT="${{ matrix.os == 'macos-latest' && 'target/universal-apple-darwin/release/bundle' || 'target/release/bundle' }}"
          find "$BUNDLE_ROOT" -maxdepth 2 -type f -name '* *' \
            -exec bash -c 'mv "$1" "${1// /-}"' _ {} \;
          # The universal target leaks a `_universal` arch segment into the dmg
          # name (TAURI default `{name}_{version}_{target}`); drop the segment
          # (TOPTOP-Duck_<version>.dmg). The updater package (.app.tar.gz)
          # keeps its bare productName name: it is referenced by the R2
          # manifest, which is immutable per tag.
          find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name '*_universal.dmg' \
            -exec bash -c 'mv "$1" "${1//_universal.dmg/.dmg}"' _ {} \; 2>/dev/null || true

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: toptopduck-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      # The updater faces (ADR-0143): every signed artifact + its .sig, plus
      # the macOS .app.tar.gz updater package. warn when absent — before the
      # signing secret exists the main-push build must stay green; the
      # release workflow's manifest gate is the hard failure point.
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: toptopduck-updater-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.sig
            target/universal-apple-darwin/release/bundle/**/*.sig
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
          retention-days: 14
