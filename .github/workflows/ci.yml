name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel superseded runs on the same ref (new push / new commit on a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + typecheck + build + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings 0

      # i18n catalog guard (ADR-0052, issue #78): @formatjs/cli extract recovers
      # the source message-id set; the check script asserts source == en-US == zh-CN
      # key sets so a new <FormattedMessage> can never ship without both translations.
      - name: i18n catalog alignment
        run: npm run i18n:check

      # `npm run build` = tsc --noEmit && vite build — covers type-checking + bundle.
      - name: Type-check & build
        run: npm run build

      - name: Test (Vitest)
        run: npm test

  # Three-OS matrix (ADR-0131): clippy runs on every leg as the check-profile
  # --all-targets compile of the platform dependency graph — that compile is
  # the multi-OS coverage. fmt and tests stay ubuntu-only: fmt results are
  # platform-independent, and the suite has only ever run on Linux CI.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Tauri v2 compiles the webview layer on Linux even when bundling is off;
      # duckdb "bundled" also needs a C/C++ toolchain (build-essential).
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches cargo registry + target — critical: duckdb "bundled" compiles
      # DuckDB from C++ source (~5-8 min cold); this drops warm runs to ~2 min.
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        if: runner.os == 'Linux'
        run: cargo test --workspace

  # Release face (ADR-0131): the full tauri build and bundle artifact upload
  # run on pushes to main only — the release flow picks the artifacts up from
  # there. PR-side multi-OS compile coverage lives in the rust matrix above;
  # a develop push is mid-chain and stays quality-gate-only.
  build:
    name: Build (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      # Let sibling legs finish when one fails — the per-OS report is the
      # whole point of the matrix.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      # Same cache setup as the rust job (keys are per job + OS, so legs warm
      # their own slice) — duckdb "bundled" compiles DuckDB from C++ source
      # (~5-8 min cold per OS).
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Quality gates are NOT repeated here: the frontend/rust jobs own them,
      # and tauri's beforeBuildCommand (tsc --noEmit + vite build) already
      # covers type-check + bundle for the packaged app.
      - name: Build (tauri build)
        run: npm run tauri -- build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: toptopduck-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
